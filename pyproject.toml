[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-llm"
version = "0.1.0"
description = "Qwen3-4B chess SFT + GRPO distilled from Stockfish, with a Matrix UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-chess>=1.11",
  "pyarrow>=16",
  "pyyaml>=6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2",
]

[project.optional-dependencies]
train = [
  "datasets>=3.0",
  "unsloth",
  "unsloth_zoo",
  "trl",
  "peft",
  "bitsandbytes",
  "transformers",
  "accelerate",
]
dev = [
  "pytest>=8",
]

[project.scripts]
chess-sample = "chess_llm.data.sample:main"
chess-sft = "chess_llm.train.sft:main"
chess-grpo = "chess_llm.train.grpo:main"
chess-dpo = "chess_llm.train.dpo:main"
chess-eval = "chess_llm.eval.metrics:main"
chess-infer = "chess_llm.infer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
