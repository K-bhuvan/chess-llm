model_name: unsloth/Qwen3-4B-Instruct-2507
max_seq_length: 256
load_in_4bit: true
lora_r: 16
lora_alpha: 16
lora_dropout: 0
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
num_train_epochs: 1
learning_rate: 2.0e-4
warmup_ratio: 0.03
weight_decay: 0.01
lr_scheduler_type: cosine
packing: true
gradient_checkpointing: unsloth
logging_steps: 20
save_steps: 500
save_total_limit: 3
eval_steps: 2000
seed: 42
train_path: data/train.parquet
val_path: data/val.parquet
output_dir: outputs/sft
max_samples: null
max_steps: 4000
